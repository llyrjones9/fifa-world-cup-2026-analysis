<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweepstakes Aber</title>
    <link rel="icon" type="image/png" href="assets/images/icon.jpg">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
</head>
<body>
    <div class="container">
        <h1>Sweepstakes Aber</h1>
        <h2 id="subtitle"></h2>
        <h2 id="subtitle-final"></h2>
        <div class="chart-toolbar">
            <button id="toggleSeries">View Total Stake Value</button>
            <button id="resetZoom" type="button">Reset Zoom</button>
        </div>
        <div class="date-range-control">
            <div class="date-range-header">
                <label for="dateStartRange">Date range</label>
                <div class="date-range-values">
                    <span id="dateRangeStartLabel"></span>
                    <span>to</span>
                    <span id="dateRangeEndLabel"></span>
                </div>
            </div>
            <div class="dual-range">
                <input id="dateStartRange" type="range" min="0" max="0" step="1" value="0">
                <input id="dateEndRange" type="range" min="0" max="0" step="1" value="0">
                <div class="dual-range-track">
                    <div id="dualRangeFill" class="dual-range-fill"></div>
                </div>
            </div>
        </div>
        <div class="chart-container">
            <canvas id="sweepChart"></canvas>
        </div>
    </div>
    <script src="js/main.js" defer></script>
</body>
</html>
