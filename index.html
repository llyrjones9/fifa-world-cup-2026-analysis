<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweepstakes Aber</title>
    <link rel="icon" type="image/png" href="assets/images/icon.jpg">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
    <div class="container">
        <h1>Sweepstakes Aber</h1>
        <h2 id="subtitle"></h2>
        <h2 id="subtitle-final"></h2>
        <div class="chart-toolbar">
            <button id="toggleChampion">Hide Champion Lines</button>
        </div>
        <div class="chart-container">
            <canvas id="sweepChart"></canvas>
        </div>
        <div class="chart-legend-key">
            <span class="key-solid">&#8212;</span> Total &nbsp;&nbsp;
            <span class="key-dashed">- -</span> Champion only
        </div>
    </div>

    <script src="js/main.js" defer></script>
</body>
</html>
